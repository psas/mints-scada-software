name: CI

env:
  QT_QPA_PLATFORM: offscreen

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  ci:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - name: Install Qt dependencies
        run: sudo apt update && sudo apt install -y libqt6gui6

      - name: Set up Python 3.13
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install . --group dev

      # always() && ... is so that all checks get run (but only if deps install)
      # otherwise it'd stop on the first failed check

      - name: Lint with ruff
        if: always() && steps.dependencies.conclusion == 'success'
        run: ruff check .

      - name: Format with ruff
        if: always() && steps.dependencies.conclusion == 'success'
        run: ruff format --check .

      - name: Type check with basedpyright
        if: always() && steps.dependencies.conclusion == 'success'
        run: basedpyright

      - name: Test with pytest
        if: always() && steps.dependencies.conclusion == 'success'
        run: pytest
